name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Prepare published files
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "The GOOGLE_MAPS_API_KEY secret is missing."
            exit 1
          fi

          if ! grep -q "__GOOGLE_MAPS_API_KEY__" reviews-config.js; then
            echo "reviews-config.js does not contain the safe placeholder."
            exit 1
          fi

          SITE_DIR="$RUNNER_TEMP/site"
          mkdir "$SITE_DIR"
          cp -R . "$SITE_DIR/"
          rm -rf "$SITE_DIR/.git" "$SITE_DIR/.github"
          sed -i "s|__GOOGLE_MAPS_API_KEY__|${GOOGLE_MAPS_API_KEY}|g" "$SITE_DIR/reviews-config.js"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
